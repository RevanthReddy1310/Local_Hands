<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Local Hands - Repairs & Services</title>

</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="nav-left">
      <img src="assets/logo.jpg" alt="logo" class="logo">

    <div class="nav-center">
      <a href="index.html#home">Home</a>
      <a href="index.html#aboutprovs">About Us</a>
      <a href="/form.html">Become a Provider</a>
      <a href="booking-status.html#booking-status">Booking Status</a>

    <div class="nav-right">

    </div>

</div>

<div id="cardGrid" class="card-grid"></div>

      document.getElementById("sidebar").style.left = "0";

      document.getElementById("sidebar").style.left = "-100%";
    }
  </script>

</html>
