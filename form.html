<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Information Form</title>
  <link rel="stylesheet" href="./form.css">
  
</head>
<body>
  <!-- Background video -->
  <video autoplay muted loop id="bg-video">
    <source src="./assets/WhatsApp Video 2025-08-01 at 23.24.13_e973819b.mp4" type="video/mp4" />
  </video>

  <!-- Tinted overlay -->
  <div class="overlay">

  </div>

  <!-- Close button -->
  <div class="close-button" onclick="handleClose()">✖</div>

  <!-- Form Section -->
  <div class="form-wrapper">
    <div class="form-container">
      <h2>Provider Information Form</h2>
      <form id="userForm" onsubmit="return validateForm()" enctype="multipart/form-data">
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="first_name" required />

        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" name="last_name" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" required />

        <label for="address">Address</label>
        <textarea id="address" name="address" rows="3" required></textarea>

        <label for="occupation">Job Title</label>
        <input type="text" id="occupation" name="occupation" required />

        <label for="image">Upload Image</label>
        <label for="image" class="custom-file-upload">Upload Image</label>
        <input type="file" id="image" name="image" accept="image/*" required onchange="showPreview()" />

        <label for="password">Set Password</label>
        <input type="password" id="password" name="password" pattern=".{6,}" title="Password must be at least 6 characters" required />

        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required />

        <p id="error-message" style="color: red"></p>
        <button type="submit">Submit</button>
      </form>
    </div>

    <!-- Image preview -->
    <div class="image-upload-section">
      <img id="preview" />
      <span id="image-tick" class="tick-icon" style="display: none">&#10004;</span>
    </div>
  </div>

 <script src="./form.js" >
  
 </script>
</body>
</html>
