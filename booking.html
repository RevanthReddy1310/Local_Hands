<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Service - Local Hands</title>
    <style>
        /* General styling for a polished look */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f4f8; /* Light blue-gray background */
            color: #333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navigation Bar */
        .navbar {
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-left .logo {
            height: 50px;
        }

        .nav-center {
            display: flex;
            gap: 2.5rem;
        }

        .nav-center a {
            text-decoration: none;
            color: #555;
            font-weight: 700;
            font-size: 1.1rem;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-center a:hover {
            color: #ff7f50; /* Coral color for hover effect */
        }

        .nav-center a:after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            display: block;
            margin-top: 5px;
            right: 0;
            background: #ff7f50;
            transition: width 0.3s ease;
        }

        .nav-center a:hover:after {
            width: 100%;
            left: 0;
            background: #ff7f50;
        }

        .nav-right .hamburger {
            font-size: 1.8rem;
            cursor: pointer;
            display: none;
        }

        /* Main Content Container */
        .main-container {
            display: flex;
            max-width: 1200px;
            width: 90%;
            margin: 2rem auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            flex-grow: 1;
        }

        /* Left Panel - Provider Info */
        .left-panel {
            flex: 1;
            padding: 2.5rem;
            background-color: #e3f2fd; /* Light blue background */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .back-button-container {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
        }

        .back-button {
            background-color: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #555;
            font-weight: 700;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .back-button:hover {
            transform: translateX(-5px);
            color: #ff7f50;
        }

        .provider-photo img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .left-panel h3 {
            margin-top: 1.5rem;
            font-size: 1.8rem;
            color: #34495e;
            font-weight: bold;
        }

        .info-block {
            margin-top: 2rem;
            text-align: left;
            width: 100%;
        }

        .info-block p {
            margin: 0.8rem 0;
            font-size: 1.1rem;
            color: #555;
        }

        .info-block strong {
            color: #34495e;
        }

        /* Right Panel - Booking Form */
        .right-panel {
            flex: 2;
            padding: 2.5rem;
        }

        .right-panel h2 {
            color: #ff7f50;
            font-size: 2.5rem;
            border-bottom: 3px solid #ff7f50;
            padding-bottom: 0.75rem;
            margin-bottom: 2rem;
            font-weight: 700;
        }

        #booking-form div {
            margin-bottom: 1.5rem;
        }

        #booking-form label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.75rem;
            font-size: 1.1rem;
            color: #444;
        }

        #booking-form input[type="text"],
        #booking-form textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        #booking-form input[type="text"]:focus,
        #booking-form textarea:focus {
            border-color: #ff7f50;
            box-shadow: 0 0 8px rgba(255, 127, 80, 0.3);
            outline: none;
        }

        #booking-form textarea {
            resize: vertical;
            min-height: 120px;
        }

        #booking-form input[type="submit"] {
            background-color: #6c5b7b; /* A deep purple color */
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        #booking-form input[type="submit"]:hover {
            background-color: #ff7f50;
            transform: translateY(-2px);
        }
        
        /* Footer styling */
        .footer {
            background: #e1c4a6;
            color: black;
            padding: 60px 40px 30px;
            font-family: 'Segoe UI', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .footer .logo-col {
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer .footlogo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 5px;
        }

        .footer .row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 30px;
        }

        .footer .col {
            flex: 1 1 200px;
            min-width: 200px;
        }

        .footer p {
            font-size: 15px;
            line-height: 1.6;
            margin: 10px 0;
        }

        .footer h3 {
            color: black;
            margin-bottom: 15px;
            position: relative;
            font-size: 18px;
            font-weight: 600;
        }

        .footer .underline span {
            display: block;
            width: 40px;
            height: 3px;
            background: #ff7b00;
            margin-top: 5px;
            border-radius: 2px;
            animation: expandLine 1s ease forwards;
        }

        @keyframes expandLine {
            from {
                width: 0;
            }

            to {
                width: 70px;
            }
        }

        .footer ul {
            list-style: none;
            padding: 0;
        }

        .footer ul li a {
            color: black;
            text-decoration: none;
            display: inline-block;
            margin: 8px 0;
            transition: all 0.3s ease;
        }

        .footer ul li a:hover {
            color: #ff7b00;
            transform: translateX(5px);
        }

        .footer form {
            display: flex;
            align-items: center;
            margin-top: 10px;
            background: #222;
            padding: 8px 12px;
            border-radius: 25px;
            border: 1px solid #333;
        }

        .fa-envelope {
            color: #ff7b00;
        }

        .footer form input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            padding: 8px;
        }

        .footer form button {
            border: none;
            background: #ff7b00;
            color: black;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .footer form button:hover {
            background: #e76700;
        }

        .footer .social-ic {
            margin-top: 20px;
        }

        .footer .social-ic i {
            font-size: 20px;
            margin-right: 15px;
            color: black;
            transition: transform 0.3s ease, color 0.3s ease;
            cursor: pointer;
        }

        .footer .social-ic i:hover {
            color: #ff7b00;
            transform: scale(1.2);
        }

        .footer hr {
            border-color: rgb(0, 0, 0);
            margin-top: 30px;
        }

        .footer .copyrights {
            text-align: center;
            font-size: 14px;
            color: black;
            padding-top: 10px;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                margin: 1rem;
            }

            .navbar {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .nav-left, .nav-right {
                width: 100%;
                text-align: center;
            }

            .nav-center {
                display: none; /* Hide nav links on small screens */
                flex-direction: column;
                width: 100%;
                background-color: #fff;
            }
            
            .nav-center.active {
                display: flex;
            }

            .nav-center a {
                padding: 1rem 0;
                border-top: 1px solid #eee;
            }

            .nav-right .hamburger {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="nav-left">
            <img src="./assets/logo.jpg" alt="logo" class="logo">
        </div>
        <div class="nav-center">
            <a href="#home">Home</a>
            <a href="#About-Us">About Us</a>
            <a href="#provider">Become a Provider</a>
            <a href="#booking-status">Booking Status</a>
        </div>
        <div class="nav-right">
            <div class="hamburger" onclick="openMenu()">☰</div>
        </div>
    </div>
    
    <div class="main-container">
        <div class="left-panel" id="serviceProviderInfo">
            <div class="back-button-container">
                <button class="back-button" onclick="window.history.back()">← Back</button>
            </div>
            <div class="provider-photo">
                <img src="https://placehold.co/150x150/E3F2FD/34495E?text=Provider" alt="Service Provider Photo">
            </div>
            <h3 id="providerName">Service Provider</h3>
            <div class="info-block">
                <p><strong>Category:</strong> <span id="providerCategory">Service Category</span></p>
                <p><strong>Experience:</strong> <span id="providerExperience">N/A</span></p>
                <p><strong>Rating:</strong> <span id="providerRating">⭐⭐⭐⭐☆</span></p>
                <p><strong>Phone:</strong> <span id="providerPhone">N/A</span></p>
                <p><strong>Email:</strong> <span id="providerEmail">N/A</span></p>
                <p><strong>Address:</strong> <span id="providerAddress">N/A</span></p>
                <p><strong>Specialties:</strong> <span id="providerSpecialties">N/A</span></p>
                <p><strong>Availability:</strong> <span id="providerAvailability">N/A</span></p>
            </div>
        </div>
    
        <div class="right-panel">
            <h2>Book Your Service</h2>
            <form id="booking-form">
                <div>
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" required />
                </div>
                <div>
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone" placeholder="Your contact number" required />
                </div>
                <div>
                    <label for="issue">Issue Description</label>
                    <textarea id="issue" name="issue" placeholder="Briefly describe your issue" required></textarea>
                </div>
                <div>
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" placeholder="Your service location" required />
                </div>
                <input type="submit" value="Submit Request" />
            </form>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const bookingForm = document.getElementById('booking-form');
            bookingForm.addEventListener('submit', (e) => {
                e.preventDefault();
        
                // Get form data from the user
                const customerName = document.getElementById('name').value;
                const customerPhone = document.getElementById('phone').value;
                const issueDescription = document.getElementById('issue').value;
                const customerAddress = document.getElementById('address').value;
        
                // Get provider data from the left panel
                const providerName = document.getElementById('providerName').textContent;
                const providerCategory = document.getElementById('providerCategory').textContent;
                const providerPhone = document.getElementById('providerPhone').textContent;
                const providerEmail = document.getElementById('providerEmail').textContent;
        
                // Create the new booking object
                const newBooking = {
                    id: Date.now(), // Use a timestamp as a unique ID
                    issue: issueDescription,
                    providerName: providerName,
                    providerCategory: providerCategory,
                    customerName: customerName,
                    phone: customerPhone,
                    email: providerEmail,
                    address: customerAddress,
                    bookingTime: new Date().toISOString(),
                    status: 'Pending' // Initial status for a new booking
                };
        
                // Load existing bookings from local storage, or create a new array if none exist
                let bookings = JSON.parse(localStorage.getItem('userBookings')) || [];
        
                // Add the new booking to the array
                bookings.push(newBooking);
        
                // Save the updated bookings array back to local storage
                localStorage.setItem('userBookings', JSON.stringify(bookings));
        
                // Redirect the user to the booking status page
                window.location.href = 'booking-status.html';
            });
        });
    </script>
</body>
</html>
